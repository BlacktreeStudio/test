<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vánoční losování z klobouku</title>
<style>
  :root {
    --bg1: #0f2e1f; --bg2: #1d4a33; --gold: #f2c14e; --red: #c0392b;
    --paper: #fffaf0; --ink: #2b2b2b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #fff; background: radial-gradient(circle at 50% 0%, var(--bg2), var(--bg1) 70%);
    display: flex; justify-content: center; padding: 24px 16px 48px; overflow-x: hidden;
  }
  .snow { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  .snow span { position: absolute; top: -10px; color: #fff; opacity: .7; animation: fall linear infinite; }
  @keyframes fall { to { transform: translateY(110vh) rotate(360deg); } }
  main { position: relative; z-index: 1; width: 100%; max-width: 440px; text-align: center; }
  h1 { font-size: 1.7rem; margin: 8px 0 4px; color: var(--gold); text-shadow: 0 2px 6px rgba(0,0,0,.4); }
  .sub { margin: 0 0 22px; opacity: .85; font-size: .95rem; line-height: 1.4; }
  .card { background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.15); border-radius: 18px; padding: 20px; backdrop-filter: blur(4px); }
  label { display: block; font-weight: 600; margin-bottom: 8px; }
  select {
    width: 100%; font-size: 1.1rem; padding: 12px 14px; border-radius: 12px; border: 2px solid var(--gold);
    background: var(--paper); color: var(--ink); appearance: none;
    background-image: linear-gradient(45deg, transparent 50%, var(--ink) 50%), linear-gradient(135deg, var(--ink) 50%, transparent 50%);
    background-position: calc(100% - 20px) 50%, calc(100% - 14px) 50%; background-size: 6px 6px; background-repeat: no-repeat;
  }
  button {
    margin-top: 16px; width: 100%; font-size: 1.15rem; font-weight: 700; padding: 14px; border: 0; border-radius: 12px;
    background: var(--red); color: #fff; cursor: pointer; box-shadow: 0 4px 0 #7d241b; transition: transform .1s;
  }
  button:active { transform: translateY(3px); box-shadow: 0 1px 0 #7d241b; }
  button:disabled { background: #777; box-shadow: 0 4px 0 #444; cursor: not-allowed; }
  button.ghost { background: transparent; border: 2px solid rgba(255,255,255,.4); box-shadow: none; font-size: 1rem; }

  .stage { position: relative; height: 260px; margin: 18px 0 6px; }
  .hat { position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); width: 220px; cursor: pointer; }
  .hat.shake { animation: shake .9s ease-in-out; }
  @keyframes shake {
    0%,100% { transform: translateX(-50%) rotate(0); }
    20% { transform: translateX(-50%) rotate(-8deg); } 40% { transform: translateX(-50%) rotate(8deg); }
    60% { transform: translateX(-50%) rotate(-6deg); } 80% { transform: translateX(-50%) rotate(5deg); }
  }
  .papers { position: absolute; left: 50%; bottom: 70px; transform: translateX(-50%); width: 140px; height: 60px; }
  .papers i {
    position: absolute; bottom: 0; width: 34px; height: 46px; background: var(--paper); border-radius: 3px;
    box-shadow: 0 1px 3px rgba(0,0,0,.4); transition: opacity .4s;
  }
  .note {
    position: absolute; left: 50%; bottom: 90px; width: 64px; height: 84px; margin-left: -32px;
    background: var(--paper); color: var(--ink); border-radius: 4px; box-shadow: 0 6px 20px rgba(0,0,0,.45);
    opacity: 0; display: flex; align-items: center; justify-content: center; text-align: center;
    font-family: "Segoe Print", "Comic Sans MS", cursive; font-size: 0; overflow: hidden; z-index: 3;
  }
  .note.out { animation: pull 1.4s cubic-bezier(.2,.8,.2,1) forwards; }
  @keyframes pull {
    0% { opacity: 1; transform: translateY(60px) scale(.6) rotate(-10deg); }
    45% { opacity: 1; transform: translateY(-110px) scale(.8) rotate(8deg); width: 64px; height: 84px; margin-left: -32px; font-size: 0; }
    100% { opacity: 1; transform: translateY(-40px) rotate(-2deg); width: 260px; height: 150px; margin-left: -130px; font-size: 2.4rem; }
  }
  .note.static { opacity: 1; transform: translateY(-40px) rotate(-2deg); width: 260px; height: 150px; margin-left: -130px; font-size: 2.4rem; }
  .note::before { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(transparent 0 27px, #d9e6f2 27px 28px); opacity: .6; }
  .note b { position: relative; }

  .result { min-height: 72px; font-size: 1.05rem; line-height: 1.5; }
  .result strong { color: var(--gold); font-size: 1.25rem; }
  .hint { font-size: .85rem; opacity: .75; margin-top: 14px; line-height: 1.4; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="snow" id="snow" aria-hidden="true"></div>
<main>
  <h1>🎄 Vánoční losování 🎅</h1>
  <p class="sub">Vyber své jméno a vytáhni si z klobouku papírek.<br>Komu padne tvůj los, tomu letos dáváš dárek.</p>

  <div class="card">
    <div id="pickStep">
      <label for="who">Kdo jsi?</label>
      <select id="who" disabled><option value="">Načítám klobouk…</option></select>
    </div>

    <div class="stage">
      <div class="note" id="note"><b id="noteName"></b></div>
      <div class="papers" id="papers"></div>
      <svg class="hat" id="hat" viewBox="0 0 220 170" role="img" aria-label="Klobouk">
        <ellipse cx="110" cy="150" rx="105" ry="18" fill="#111"/>
        <path d="M45 150 L55 30 Q110 10 165 30 L175 150 Z" fill="#1b1b1b"/>
        <ellipse cx="110" cy="30" rx="55" ry="12" fill="#2a2a2a"/>
        <ellipse cx="110" cy="30" rx="46" ry="8" fill="#000"/>
        <path d="M50 112 L170 112 L172 132 L48 132 Z" fill="#c0392b"/>
        <circle cx="150" cy="122" r="7" fill="#f2c14e"/>
        <path d="M143 112 l-8 -14 l10 4 z M157 112 l8 -14 l-10 4 z" fill="#2e8b57"/>
      </svg>
    </div>

    <div class="result" id="result" aria-live="polite"></div>
    <button id="drawBtn" disabled>Sáhnout do klobouku 🎩</button>
    <p class="hint" id="hint">Sám sebe si vytáhnout nemůžeš. Jakmile losuješ, tvé jméno se všem ostatním zamkne.</p>
  </div>
</main>

<script type="module">
// ================== NASTAVENÍ ==================
// Sem patří nastavení projektu z Firebase konzole (Project settings → Your apps → Web app → Config).
const firebaseConfig = {
  apiKey: "AIzaSyAetuX2U43jS388XD9tllhYXZow0fk2w4I",
  authDomain: "christmas-hat-b7f87.firebaseapp.com",
  databaseURL: "https://christmas-hat-b7f87-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "christmas-hat-b7f87",
  storageBucket: "christmas-hat-b7f87.firebasestorage.app",
  messagingSenderId: "847626620347",
  appId: "1:847626620347:web:04f6e4521d59434b1b089e"
};
// Název losování v databázi. Pro nové losování (např. příští rok) stačí změnit.
// Zkušební režim: přidej na konec odkazu #zkouska – losuje se z jiného, cvičného klobouku.
const TEST = location.hash === "#zkouska";
const DRAW_ID = TEST ? "zkouska" : "vanoce2026";
// ===============================================

const NAMES = ["Eva", "Katka", "Děda", "Babička", "Martin", "Hanka"];
const N = NAMES.length, ALL = (1 << N) - 1;
const FB = "https://www.gstatic.com/firebasejs/10.12.2/";

const $ = id => document.getElementById(id);
const who = $("who"), drawBtn = $("drawBtn"), hat = $("hat"), note = $("note"), noteName = $("noteName");
const result = $("result"), papersEl = $("papers"), hint = $("hint");

const pop = m => { let c = 0; for (; m; m &= m - 1) c++; return c; };
const rand32 = () => crypto.getRandomValues(new Uint32Array(1))[0];

// Lze zbylé lidi a zbylé papírky spárovat tak, aby nikdo neměl sám sebe?
function feasible(people, papers) {
  if (!people) return true;
  const i = 31 - Math.clz32(people & -people);
  for (let p = 0; p < N; p++)
    if ((papers >> p & 1) && p !== i && feasible(people & ~(1 << i), papers & ~(1 << p))) return true;
  return false;
}

// Vlastní los si pamatuje jen tento telefon. V databázi NENÍ, kdo si koho vytáhl.
const memKey = "vanocni-klobouk-" + DRAW_ID;
const remember = m => { try { localStorage.setItem(memKey, JSON.stringify(m)); } catch {} };
const recall = () => { try { return JSON.parse(localStorage.getItem(memKey)); } catch { return null; } };

let hatState = null, busy = false, finished = false;

function renderPapers(count) {
  papersEl.innerHTML = "";
  for (let k = 0; k < count; k++) {
    const el = document.createElement("i");
    el.style.left = (8 + k * (100 / Math.max(count, 1))) + "px";
    el.style.transform = `rotate(${(k - count / 2) * 9}deg)`;
    papersEl.appendChild(el);
  }
}

function render() {
  if (finished || busy || !hatState) return;
  const sel = who.value;
  who.length = 0;
  const ph = document.createElement("option"); ph.value = ""; ph.textContent = "— vyber své jméno —"; who.appendChild(ph);
  NAMES.forEach((n, i) => {
    const o = document.createElement("option");
    o.value = i; o.disabled = !!(hatState.drawn >> i & 1);
    o.textContent = o.disabled ? n + " 🔒 (už losoval/a)" : n;
    who.appendChild(o);
  });
  who.disabled = false;
  who.value = (sel !== "" && !(hatState.drawn >> +sel & 1)) ? sel : "";
  drawBtn.disabled = who.value === "";
  renderPapers(pop(hatState.papers));
  const mine = recall();
  if (hatState.drawn === ALL) {
    result.innerHTML = "<strong>Všichni už mají vylosováno! 🎉</strong><br>Veselé Vánoce!";
    $("pickStep").classList.add("hidden"); drawBtn.classList.add("hidden");
  } else result.innerHTML = "";
  if (mine) {
    hint.innerHTML = `Na tomto telefonu už losoval/a <b>${NAMES[mine.me]}</b>.<br>
      <a role="button" id="again" style="color:var(--gold);text-decoration:underline;cursor:pointer">Ukázat znovu můj papírek</a>`;
    $("again").onclick = e => { e.preventDefault(); showResult(mine, false); };
  }
}

function showResult(m, animate) {
  finished = true;
  $("pickStep").classList.add("hidden"); drawBtn.classList.add("hidden");
  noteName.textContent = NAMES[m.giftee]; result.innerHTML = "";
  const done = () => {
    result.innerHTML = `${NAMES[m.me]}, letos dáváš dárek:<br><strong>🎁 ${NAMES[m.giftee]} 🎁</strong><br><small>Pssst… nikomu to neprozrazuj!</small>`;
    hint.textContent = "Tvůj papírek vidíš jen ty – nikde se neukládá, kdo si koho vytáhl.";
  };
  if (animate) {
    hat.classList.remove("shake"); void hat.offsetWidth; hat.classList.add("shake");
    setTimeout(() => { note.className = "note out"; if (papersEl.lastChild) papersEl.lastChild.style.opacity = 0; }, 800);
    setTimeout(done, 2300);
  } else { note.className = "note static"; done(); }
}

function fail(msg) { result.innerHTML = msg; }

async function start() {
  if (!firebaseConfig) { fail("⚠️ Aplikace ještě není propojená s databází (chybí nastavení Firebase)."); return; }
  let db, api;
  const timer = setTimeout(() => { if (!hatState) fail("Nepodařilo se načíst klobouk. Zkontroluj internet a zkus stránku obnovit."); }, 10000);
  try {
    const { initializeApp } = await import(FB + "firebase-app.js");
    api = await import(FB + "firebase-database.js");
    db = api.getDatabase(initializeApp(firebaseConfig));
  } catch (e) { clearTimeout(timer); fail("Nepodařilo se připojit k databázi."); return; }
  const ref = api.ref(db, "draws/" + DRAW_ID);

  // Živé sledování: jakmile někdo losuje, jeho jméno se všem hned zamkne.
  api.onValue(ref, snap => {
    clearTimeout(timer);
    hatState = snap.val() || { drawn: 0, papers: ALL };
    render();
  }, () => { clearTimeout(timer); fail("Do databáze nejde číst. Zkontroluj pravidla (Rules) ve Firebase."); });

  async function draw() {
    if (busy || who.value === "") return;
    const me = +who.value;
    const prev = recall();
    if (prev) {
      if (prev.me === me) showResult(prev, false);
      else fail(`Z tohoto telefonu už losoval/a <b>${NAMES[prev.me]}</b>.<br>Každý losuje na svém telefonu.`);
      return;
    }
    busy = true; drawBtn.disabled = true; who.disabled = true;
    let giftee = null, reason = "";
    try {
      // Zamknutí jména a vytažení papírku proběhne najednou (transakce),
      // takže ani dva lidé ve stejnou chvíli nemůžou vytáhnout stejný papírek.
      const res = await api.runTransaction(ref, cur => {
        const s = cur || { drawn: 0, papers: ALL };
        if (s.drawn >> me & 1) { reason = "taken"; return; }
        const people = ALL & ~s.drawn & ~(1 << me);
        const opts = [];
        for (let p = 0; p < N; p++)
          if ((s.papers >> p & 1) && p !== me && feasible(people, s.papers & ~(1 << p))) opts.push(p);
        if (!opts.length) { reason = "empty"; return; }
        giftee = opts[rand32() % opts.length];
        reason = "";
        return { drawn: s.drawn | (1 << me), papers: s.papers & ~(1 << giftee) };
      }, { applyLocally: false });
      if (!res.committed) {
        busy = false;
        render();
        fail(reason === "taken" ? `<b>${NAMES[me]}</b> už losoval/a. Pokud jsi to nebyl/a ty, dej vědět ostatním.` : "Klobouk je prázdný.");
        return;
      }
    } catch (e) {
      busy = false; render(); fail("Losování se nepovedlo (chyba připojení). Zkus to znovu."); return;
    }
    const m = { me, giftee };
    remember(m);
    busy = false;
    showResult(m, true);
  }

  who.addEventListener("change", () => { drawBtn.disabled = who.value === ""; result.innerHTML = ""; });
  drawBtn.addEventListener("click", draw);
  hat.addEventListener("click", () => { if (!drawBtn.disabled && !drawBtn.classList.contains("hidden")) draw(); });
}

if (TEST) document.querySelector("h1").insertAdjacentHTML("afterend",
  '<p style="background:#f2c14e;color:#222;border-radius:10px;padding:8px;font-weight:700">🧪 ZKUŠEBNÍ REŽIM – tohle losování se nepočítá</p>');
const snow = $("snow");
for (let k = 0; k < 28; k++) {
  const s = document.createElement("span"); s.textContent = "❄";
  s.style.left = Math.random() * 100 + "vw"; s.style.fontSize = (8 + Math.random() * 14) + "px";
  s.style.animationDuration = (6 + Math.random() * 10) + "s"; s.style.animationDelay = (-Math.random() * 16) + "s";
  snow.appendChild(s);
}
start();
</script>
</body>
</html>
